<!DOCTYPE html>
<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      // Componente reutilizável com Props e valor padrão (operador ternário)
      function Header({ title }) {
        return <h1>{title ? title : 'Default title'}</h1>;
      }

      function HomePage() {
        const names = ['Ada Lovelace', 'Grace Hopper', 'Margaret Hamilton'];

        return (
          <div>
            {/* Reutilizando o componente Header com diferentes props */}
            <Header title="Develop. Preview. Ship." />
            <Header title="React" />

            {/* Iterando sobre uma lista com .map() e chave única key */}
            <ul>
              {names.map((name) => (
                <li key={name}>{name}</li>
              ))}
            </ul>
          </div>
        );
      }

      const domNode = document.getElementById('app');
      const root = createRoot(domNode);
      root.render(<HomePage />);
    </script>
  </body>
</html>
